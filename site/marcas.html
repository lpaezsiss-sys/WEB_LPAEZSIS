<!DOCTYPE html>

<head>

  <meta name="description" content="Representaciones y distribución LPAEZsis: Sonic Air Systems, LYC, MOVEX, ISODUR, COMBI, HAIDA.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Representaciones y Distribución | LPAEZsis">
  <meta property="og:description" content="Conoce las representaciones y distribución industrial de LPAEZsis en Chile.">

  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css?v=114">
</head>
<body>
  <div id="site-header-mount"></div>

  <!-- Hero principal con contenedor oscuro permanente (maquetado independiente de la API) -->
  <section class="brand-hero" aria-labelledby="brandTitle">
    <div class="brand-hero__inner container">
      <h1 class="brand-hero__title" id="brandTitle">Representaciones y Distribución</h1>
      <p class="brand-hero__description" id="brandDescription">
        Socios tecnológicos para soplado, packaging, movimiento y control de calidad.
      </p>
    </div>
  </section>

  <!-- Contenedor principal del cuerpo: estructura fija; JS solo rellena nodos -->
  <main class="brand-content-wrapper container" id="main">

    <!-- Selector de marcas estable -->
    <div class="brand-selector-grid" id="brandSelectorGrid" aria-label="Seleccionar marca"></div>

    <!-- Ficha enriquecida (nodo siempre presente; vacío/oculto si no hay HTML) -->
    <div class="brand-catalog-body" id="brandContent" hidden></div>
    <div class="brand-gallery" id="brandGallery" hidden></div>

    <!-- Sección de catálogo de la marca -->
    <section class="brand-products-section" aria-labelledby="brandProductsTitle">
      <h2 id="brandProductsTitle">Equipos de la marca</h2>
      <div class="catalog-grid product-grid" id="brandProductsGrid">
        <p class="empty-state" id="brandProductsPlaceholder">Cargando equipos…</p>
      </div>
      <div class="section-actions is-start">
        <a class="btn btn-primary" id="brandQuoteCta" href="cotizacion.html">Pedir cotización de esta marca</a>
        <a class="btn btn-outline" href="catalogo.html">Ver todos los productos</a>
      </div>
    </section>
  </main>

  <div id="site-footer-mount"></div>
  <script src="js/layout.js?v=36"></script>
  <script src="js/site.js?v=25"></script>
  <script src="js/marcas.js?v=115"></script>
</body>
</html>
