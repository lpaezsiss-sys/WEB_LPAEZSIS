<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Producto | LPAEZsis</title>
  <meta name="description" content="Detalle de producto industrial LPAEZsis.">
  <meta name="robots" content="index,follow">
  <link rel="stylesheet" href="css/style.css?v=84">
</head>
<body>
  <div id="site-header-mount"></div>
  <main id="main" class="section">
    <nav class="breadcrumb" id="productBreadcrumb" aria-label="Migas de pan" hidden>
      <a href="index.html">Inicio</a>
      <span class="breadcrumb-sep" aria-hidden="true">/</span>
      <a href="catalogo.html">Productos</a>
      <span class="breadcrumb-sep" id="crumbCatSep" aria-hidden="true" hidden>/</span>
      <a href="catalogo.html" id="crumbCategory" hidden></a>
      <span class="breadcrumb-sep" aria-hidden="true">/</span>
      <span id="crumbCurrent"></span>
    </nav>
    <p class="empty-state" id="productLoading">Cargando producto…</p>
    <div class="detail-layout" id="productDetail" hidden>
      <div class="detail-visual" id="productVisual">LPAEZ</div>
      <div>
        <div class="product-meta" id="productMeta"></div>
        <h1 id="productName"></h1>
        <p id="productLead" class="product-lead" hidden></p>
        <p id="productDesc"></p>
        <div class="product-specs" id="productSpecs" hidden></div>
        <p class="product-price" id="productPrice"></p>
        <div class="qty-row" role="group" aria-label="Cantidad">
          <button type="button" id="qtyMinus" aria-label="Quitar">−</button>
          <span id="qtyCount">1</span>
          <button type="button" id="qtyPlus" aria-label="Agregar">+</button>
        </div>
        <div class="actions-row" id="productActions"></div>
      </div>
    </div>
  </main>
  <div id="site-footer-mount"></div>
  <script src="js/layout.js?v=35"></script>
  <script src="js/site.js?v=25"></script>
  <script>
    var qty = 1;
    var product = null;
    var slug = Lpaez.queryParam("slug");
    function syncQty() {
      document.getElementById("qtyCount").textContent = String(qty);
    }
    document.getElementById("qtyMinus").onclick = function () {
      if (qty > 1) { qty -= 1; syncQty(); }
    };
    document.getElementById("qtyPlus").onclick = function () {
      qty += 1; syncQty();
    };
    function showProductMissing(message) {
      document.getElementById("productLoading").innerHTML =
        "<p>" + message + "</p>" +
        "<p class='empty-actions'>" +
        "<a class='btn btn-primary btn-sm' href='catalogo.html'>Ver productos</a>" +
        "<a class='btn btn-outline btn-sm' href='cotizacion.html'>Pedir cotización</a>" +
        "</p>";
    }
    if (!slug) {
      showProductMissing("Producto no especificado.");
    } else {
      Lpaez.api("/api/products/" + encodeURIComponent(slug)).then(function (res) {
        if (!res.ok) {
          showProductMissing("Producto no encontrado.");
          return;
        }
        product = res.data;
        document.title = (product.seo_title || product.name) + " | LPAEZsis";
        var desc = document.querySelector('meta[name="description"]');
        if (desc) desc.setAttribute("content", product.seo_description || (product.description || "").slice(0, 160));
        var link = document.createElement("link");
        link.rel = "canonical";
        link.href = "https://lpaezsis.cl/producto.html?slug=" + encodeURIComponent(product.slug);
        document.head.appendChild(link);

        document.getElementById("productLoading").hidden = true;
        document.getElementById("productDetail").hidden = false;
        document.getElementById("productName").textContent = product.name;
        var ficha = Lpaez.parseProductFicha ? Lpaez.parseProductFicha(product.description) : { detail: product.description || "", specs: [], datasheet: "" };
        var lead = document.getElementById("productLead");
        if (product.seo_description) {
          lead.hidden = false;
          lead.textContent = product.seo_description;
        } else {
          lead.hidden = true;
        }
        document.getElementById("productDesc").textContent = ficha.detail || product.description || "";
        var specsEl = document.getElementById("productSpecs");
        if (ficha.specs && ficha.specs.length) {
          specsEl.hidden = false;
          specsEl.innerHTML =
            "<h2>Especificaciones técnicas</h2><dl>" +
            ficha.specs
              .map(function (row) {
                return "<div><dt>" + Lpaez.escapeHtml(row.label) + "</dt><dd>" + Lpaez.escapeHtml(row.value) + "</dd></div>";
              })
              .join("") +
            "</dl>";
        } else {
          specsEl.hidden = true;
          specsEl.innerHTML = "";
        }
        document.getElementById("productPrice").textContent =
          product.sale_mode === "buy" && product.price_clp != null
            ? Lpaez.formatPrice(product.price_clp)
            : "Precio a cotizar";
        document.getElementById("productMeta").innerHTML =
          '<span class="badge-mode ' + (product.sale_mode === "buy" ? "badge-buy" : "badge-quote") + '">' +
          (product.sale_mode === "buy" ? "Comprar" : "Cotizar") + "</span>" +
          '<span class="badge-stock">' + Lpaez.stockLabel(product.stock_status) + "</span>";

        var crumb = document.getElementById("productBreadcrumb");
        var crumbCat = document.getElementById("crumbCategory");
        var crumbCatSep = document.getElementById("crumbCatSep");
        document.getElementById("crumbCurrent").textContent = product.name;
        if (product.category_slug && product.category_name) {
          crumbCat.hidden = false;
          crumbCatSep.hidden = false;
          crumbCat.textContent = product.category_name;
          crumbCat.href = "catalogo.html?category=" + encodeURIComponent(product.category_slug);
        } else {
          crumbCat.hidden = true;
          crumbCatSep.hidden = true;
        }
        crumb.hidden = false;

        if (product.image_url || Lpaez.resolveProductImage(product)) {
          var fallbacks = Lpaez.productImageCandidates
            ? Lpaez.productImageCandidates(product)
            : [product.image_url, "img/products/A07-10015.jpg"];
          var src = product.image_url && fallbacks.indexOf(product.image_url) !== -1
            ? product.image_url
            : (fallbacks[0] || Lpaez.resolveProductImage(product));
          var imgHtml = Lpaez.imgTagHtml
            ? Lpaez.imgTagHtml(src, product.name, "", fallbacks)
            : '<img src="' + src + '" alt="' + Lpaez.escapeHtml(product.name) + '">';
          document.getElementById("productVisual").innerHTML = imgHtml;
        }
        var actions = document.getElementById("productActions");
        var datasheetUrl = Lpaez.resolveDatasheetUrl ? Lpaez.resolveDatasheetUrl(product) : "";
        var pdfBtn = datasheetUrl
          ? '<a class="btn btn-outline" href="' + datasheetUrl + '" target="_blank" rel="noopener">Descargar ficha técnica PDF</a>'
          : "";
        if (product.sale_mode === "buy") {
          actions.innerHTML =
            '<button type="button" class="btn btn-primary" id="btnBuy">Agregar al carrito</button>' +
            '<button type="button" class="btn btn-outline" id="btnAlsoQuote">También a cotización</button>' +
            pdfBtn;
          document.getElementById("btnBuy").onclick = function () { Lpaez.addToCart(product, qty); };
          document.getElementById("btnAlsoQuote").onclick = function () { Lpaez.addToQuote(product, qty); };
        } else {
          actions.innerHTML =
            '<button type="button" class="btn btn-primary" id="btnQuote">Solicitar cotización</button>' +
            pdfBtn;
          document.getElementById("btnQuote").onclick = function () { Lpaez.addToQuote(product, qty); };
        }
        Lpaez.injectJsonLd({
          "@context": "https://schema.org",
          "@type": "Product",
          name: product.name,
          description: product.description,
          sku: product.slug,
          brand: product.brand_name ? { "@type": "Brand", name: product.brand_name } : undefined,
          offers: product.sale_mode === "buy" && product.price_clp != null ? {
            "@type": "Offer",
            priceCurrency: "CLP",
            price: product.price_clp,
            availability: product.stock_status === "in_stock"
              ? "https://schema.org/InStock"
              : "https://schema.org/PreOrder"
          } : {
            "@type": "Offer",
            priceCurrency: "CLP",
            availability: "https://schema.org/PreOrder",
            description: "Cotización"
          }
        });
        Lpaez.injectJsonLd({
          "@context": "https://schema.org",
          "@type": "BreadcrumbList",
          itemListElement: [
            { "@type": "ListItem", position: 1, name: "Inicio", item: "https://lpaezsis.cl/" },
            { "@type": "ListItem", position: 2, name: "Productos", item: "https://lpaezsis.cl/catalogo.html" },
            { "@type": "ListItem", position: 3, name: product.name }
          ]
        });
      });
    }
  </script>
</body>
</html>
