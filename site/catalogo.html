<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos industriales | Catálogo B2B LPAEZsis</title>
  <meta name="description" content="Catálogo B2B LPAEZsis: secadores, turbinas, cuchillos de aire, repuestos Sonic Air y equipos de fin de línea. Filtra por industria, marca y cotiza con ficha técnica.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" id="canonicalLink" href="https://prueba1.lpaezsis.cl/catalogo.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_CL">
  <meta property="og:title" content="Productos industriales | Catálogo B2B LPAEZsis">
  <meta property="og:description" content="Compra repuestos o cotiza equipos Sonic Air. Filtros por industria y marca.">
  <meta property="og:url" id="ogUrl" content="https://prueba1.lpaezsis.cl/catalogo.html">
  <meta property="og:image" id="ogImage" content="https://prueba1.lpaezsis.cl/img/hero/plant.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="img/icons/favicon.ico" sizes="any">
  <link rel="stylesheet" href="css/style.css?v=101">
  <script>
    (function () {
      var origin = window.location.origin || "https://prueba1.lpaezsis.cl";
      var path = "/catalogo.html";
      var c = document.getElementById("canonicalLink");
      var ou = document.getElementById("ogUrl");
      var oi = document.getElementById("ogImage");
      if (c) c.href = origin + path;
      if (ou) ou.content = origin + path;
      if (oi) oi.content = origin + "/img/hero/plant.jpg";
    })();
  </script>
  <script type="application/ld+json" id="catalogItemListLd">
  {"@context":"https://schema.org","@type":"ItemList","name":"Catálogo de productos LPAEZsis","numberOfItems":0,"itemListElement":[]}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div id="site-header-mount"></div>
  <main id="main">
    <div class="page-hero page-hero--compact has-media">
      <div class="page-hero-media" aria-hidden="true">
        <picture>
          <source type="image/webp" srcset="img/hero/plant.webp">
          <img
            src="img/hero/plant.jpg"
            alt=""
            title="Catálogo industrial LPAEZsis"
            width="1920"
            height="1277"
            loading="eager"
            fetchpriority="high"
            decoding="async">
        </picture>
      </div>
      <div class="page-hero-inner">
        <h1>Equipos</h1>
        <p class="hero-description">Equipos industriales: filtra por industria o marca y solicita cotización con ficha técnica.</p>
      </div>
    </div>

    <div class="catalog-toolbar">
      <div class="catalog-filters" role="search" aria-label="Filtros del catálogo">
        <div class="filter-group" id="filterIndustriaGroup">
          <label for="industryFilter">Industria</label>
          <select id="industryFilter" class="filter-select" aria-label="Filtrar por industria">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="filter-group" id="filterCategoriaGroup">
          <label for="categoryFilter">Categoría</label>
          <select id="categoryFilter" class="filter-select" aria-label="Filtrar por categoría">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="brandFilter">Marca</label>
          <select id="brandFilter" class="filter-select" aria-label="Filtrar por marca">
            <option value="">Todas las marcas</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="modeFilter">Tipo de venta</label>
          <select id="modeFilter" class="filter-select" aria-label="Filtrar por tipo de venta">
            <option value="">Todas</option>
            <option value="buy">Comprar</option>
            <option value="quote">Cotizar</option>
          </select>
        </div>
      </div>

      <p class="catalog-hint catalog-debug-info">Catálogo de <strong>equipos</strong>. Cotiza proyectos a medida. Enlace: <code>?tipo=equipo</code>.</p>
      <p class="catalog-count" id="catalogCount" hidden></p>
    </div>

    <section class="section section--catalog" aria-labelledby="catalogGridLabel">
      <h2 id="catalogGridLabel" class="visually-hidden">Grilla de productos</h2>
      <div id="catalogLoader" class="catalog-loader" role="status" aria-live="polite">
        <p class="catalog-loading-label">Cargando catálogo…</p>
      </div>
      <div class="product-grid" id="grid-productos" tabindex="-1" aria-busy="true"></div>
      <nav class="catalog-pager" id="catalogPager" aria-label="Paginación del catálogo" hidden></nav>
    </section>
  </main>

  <dialog id="datasheetDialog" class="datasheet-dialog" aria-labelledby="datasheetTitle">
    <form method="dialog" class="dialog-body" id="datasheetForm">
      <div id="datasheetBody">
        <h3 id="datasheetTitle">Ficha técnica</h3>
      </div>
      <div class="dialog-actions">
        <button type="button" class="ghost btn btn-outline" id="datasheetClose">Cerrar</button>
      </div>
    </form>
  </dialog>

  <div id="site-footer-mount"></div>
  <script src="js/layout.js?v=36"></script>
  <script src="js/site.js?v=25"></script>
  <script src="js/catalogo.js?v=10"></script>
</body>
</html>
