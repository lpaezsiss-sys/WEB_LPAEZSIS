<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos | LPAEZsis</title>
  <meta name="description" content="Productos LPAEZsis: secadores, turbinas, cuchillos de aire, repuestos Sonic Air y equipos de fin de línea. Compra o cotiza según el producto.">
  <link rel="canonical" href="https://lpaezsis.cl/catalogo.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Productos | LPAEZsis">
  <meta property="og:description" content="Compra repuestos o cotiza equipos industriales Sonic Air y más.">
  <meta property="og:url" content="https://lpaezsis.cl/catalogo.html">
  <meta property="og:image" content="https://lpaezsis.cl/img/hero/plant.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css?v=81">
</head>
<body>
  <div id="site-header-mount"></div>
  <main id="main">
    <div class="page-hero page-hero--compact has-media">
      <div class="page-hero-media" aria-hidden="true">
        <img src="img/hero/plant.jpg" alt="" width="1600" height="400" loading="eager">
      </div>
      <div class="page-hero-inner">
        <h1>Productos</h1>
        <p>Consumibles se compran; equipos se cotizan.</p>
      </div>
    </div>
    <div class="catalog-toolbar">
      <div class="filter-chips" id="filterChips" role="group" aria-label="Categoría"></div>
      <p class="catalog-mode-label" id="modeLabel">Tipo de venta</p>
      <div class="filter-chips filter-chips--mode" aria-labelledby="modeLabel" id="modeChips" role="group">
        <button type="button" class="filter-chip is-active" data-mode="" aria-pressed="true">Todas</button>
        <button type="button" class="filter-chip" data-mode="buy" aria-pressed="false">Comprar</button>
        <button type="button" class="filter-chip" data-mode="quote" aria-pressed="false">Cotizar</button>
      </div>
      <p class="catalog-hint">Repuestos y consumibles → <strong>Comprar</strong>. Equipos industriales → <strong>Cotizar</strong>.</p>
      <p class="catalog-count" id="catalogCount" hidden></p>
    </div>
    <section class="section section--catalog">
      <div class="product-grid catalog-loading" id="catalogGrid" aria-busy="true"></div>
    </section>
  </main>
  <div id="site-footer-mount"></div>
  <script src="js/layout.js?v=32"></script>
  <script src="js/site.js?v=22"></script>
  <script>
    var grid = document.getElementById("catalogGrid");
    var filterChips = document.getElementById("filterChips");
    var modeChips = document.getElementById("modeChips");
    var catalogCount = document.getElementById("catalogCount");
    var filterCategory = { value: "" };
    var filterMode = { value: "" };
    var allProducts = [];
    var allCategories = [];

    var CHIP_SHORT = {
      secadores: "Secadores",
      "turbinas-soplado": "Turbinas",
      "cuchillos-aire": "Air knives",
      repuestos: "Repuestos",
      "fin-de-linea": "Fin de línea",
      "salas-limpias": "Salas limpias"
    };

    var EMPTY_CATS = {
      "salas-limpias": "Salas limpias y HEPA",
      "fin-de-linea": "Fin de línea",
      "cuchillos-aire": "Cuchillos de aire",
      "turbinas-soplado": "Turbinas de soplado"
    };

    function skeletonHtml() {
      var cards = [0, 1, 2, 3].map(function () {
        return '<article class="product-card skeleton-card" aria-hidden="true">' +
          '<div class="product-card-visual skeleton-block"></div>' +
          '<div class="product-card-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div><div class="skeleton-line btn"></div></div></article>';
      }).join("");
      return '<p class="catalog-loading-label">Cargando productos…</p>' + cards;
    }

    function categoriesWithProducts() {
      var slugs = {};
      allProducts.forEach(function (p) {
        if (filterMode.value && p.sale_mode !== filterMode.value) return;
        if (p.category_slug) slugs[p.category_slug] = true;
      });
      return allCategories.filter(function (c) {
        return !!slugs[c.slug];
      });
    }

    function filteredProducts() {
      return allProducts.filter(function (p) {
        if (filterCategory.value && p.category_slug !== filterCategory.value) return false;
        if (filterMode.value && p.sale_mode !== filterMode.value) return false;
        return true;
      });
    }

    function syncChips() {
      filterChips.querySelectorAll(".filter-chip").forEach(function (chip) {
        var on = chip.getAttribute("data-cat") === filterCategory.value;
        chip.classList.toggle("is-active", on);
        chip.setAttribute("aria-pressed", on ? "true" : "false");
      });
      modeChips.querySelectorAll(".filter-chip").forEach(function (chip) {
        var on = chip.getAttribute("data-mode") === filterMode.value;
        chip.classList.toggle("is-active", on);
        chip.setAttribute("aria-pressed", on ? "true" : "false");
      });
    }

    function renderChips() {
      var cats = categoriesWithProducts();
      if (filterCategory.value && !cats.some(function (c) { return c.slug === filterCategory.value; })) {
        filterCategory.value = "";
      }
      filterChips.innerHTML =
        '<button type="button" class="filter-chip' + (!filterCategory.value ? " is-active" : "") +
        '" data-cat="" aria-pressed="' + (!filterCategory.value ? "true" : "false") +
        '" title="Todas las categorías">Todas</button>' +
        cats.map(function (c) {
          var active = filterCategory.value === c.slug;
          var label = CHIP_SHORT[c.slug] || c.name;
          return '<button type="button" class="filter-chip' + (active ? " is-active" : "") +
            '" data-cat="' + Lpaez.escapeHtml(c.slug) + '" aria-pressed="' + (active ? "true" : "false") +
            '" title="' + Lpaez.escapeHtml(c.name) + '">' +
            Lpaez.escapeHtml(label) + "</button>";
        }).join("");
    }

    function emptyStateHtml() {
      var cat = filterCategory.value;
      var catLabel = EMPTY_CATS[cat] || CHIP_SHORT[cat] || "";
      var hasFilters = !!(cat || filterMode.value);
      var quoteUrl =
        "cotizacion.html" +
        (catLabel ? "?asunto=" + encodeURIComponent("Consulta: " + catLabel) : "");
      var parts = ["<div class='empty-state'>"];
      if (cat) {
        parts.push(
          "<p>Aún no hay ítems publicados" +
            (catLabel ? " en <strong>" + Lpaez.escapeHtml(catLabel) + "</strong>" : "") +
            ".</p>"
        );
        parts.push(
          "<p class='empty-actions'>" +
            "<a class='btn btn-primary btn-sm' href='" + quoteUrl + "'>Cotizar esta aplicación</a>" +
            "<button type='button' class='btn btn-outline btn-sm' id='clearCatalogFilters'>Ver todos los productos</button>" +
            "</p>"
        );
      } else if (hasFilters) {
        parts.push("<p>No hay productos con esos filtros.</p>");
        parts.push(
          "<p class='empty-actions'><button type='button' class='btn btn-primary btn-sm' id='clearCatalogFilters'>Ver todos los productos</button></p>"
        );
      } else {
        parts.push("<p>Pronto publicaremos más ítems.</p>");
        parts.push(
          "<p class='empty-actions'><a class='btn btn-primary btn-sm' href='cotizacion.html'>Pedir cotización</a></p>"
        );
      }
      parts.push("</div>");
      return parts.join("");
    }

    function bindClear() {
      var clearBtn = document.getElementById("clearCatalogFilters");
      if (!clearBtn) return;
      clearBtn.addEventListener("click", function () {
        filterCategory.value = "";
        filterMode.value = "";
        if (window.history && window.history.replaceState) {
          window.history.replaceState({}, "", "catalogo.html");
        }
        renderCatalog();
      });
    }

    function renderCatalog() {
      renderChips();
      syncChips();
      var products = filteredProducts();
      catalogCount.hidden = false;
      catalogCount.textContent =
        products.length === 1 ? "1 producto" : products.length + " productos";
      if (products.length) {
        grid.innerHTML = products.map(Lpaez.productCardHtml).join("");
      } else {
        grid.innerHTML = emptyStateHtml();
        bindClear();
      }
      Lpaez.observeReveals();
    }

    grid.innerHTML = skeletonHtml();
    grid.classList.add("catalog-loading");
    grid.setAttribute("aria-busy", "true");

    Promise.all([Lpaez.api("/api/categories"), Lpaez.api("/api/products")]).then(function (results) {
      allCategories = (results[0].data && results[0].data.categories) || [];
      allProducts = (results[1].data && results[1].data.products) || [];
      filterCategory.value = Lpaez.queryParam("category") || "";
      filterMode.value = Lpaez.queryParam("sale_mode") || "";
      grid.classList.remove("catalog-loading");
      grid.setAttribute("aria-busy", "false");
      renderCatalog();
    }).catch(function () {
      grid.classList.remove("catalog-loading");
      grid.setAttribute("aria-busy", "false");
      grid.innerHTML =
        "<p class='empty-state'>No se pudo conectar con la API. Revisa el servidor.</p>";
    });

    filterChips.addEventListener("click", function (e) {
      var chip = e.target.closest(".filter-chip");
      if (!chip) return;
      filterCategory.value = chip.getAttribute("data-cat") || "";
      renderCatalog();
    });
    modeChips.addEventListener("click", function (e) {
      var chip = e.target.closest(".filter-chip");
      if (!chip) return;
      filterMode.value = chip.getAttribute("data-mode") || "";
      renderCatalog();
    });
  </script>
</body>
</html>
